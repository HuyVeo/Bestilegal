services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-viva-app
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://chatbot:${DB_PASSWORD:-changeme}@postgres:5432/chatbot_db
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - chatbot-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: chatbot-viva-postgres
    ports:
      - "${PG_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: chatbot_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: chatbot-viva-qdrant
    ports:
      - "${QDRANT_PORT:-6933}:6333"
      - "${QDRANT_GRPC_PORT:-6934}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:7
    container_name: chatbot-viva-mongodb
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-chatbot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-chatbot_db}
    volumes:
      - mongo-data:/data/db
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  chatbot-network:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  mongo-data:
